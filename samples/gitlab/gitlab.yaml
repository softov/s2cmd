# REST mappings based on service_tasker/packages/gitlab/src/{client,store}.ts.
name: "gitlab"
version: "0.1.0"
description: "GitLab API actions declared as data"
imports: ["gitlab.defaults.yaml", {"path": "gitlab.local.yaml", "optional": true}]
env: [{"path": "gitlab.env", "optional": true}]
configSchema:
  api:
    type: string
    format: uri
    pattern: "^https?://"
    description: GitLab API endpoint including /api/v4
    default: https://gitlab.com/api/v4
commands:
  me:
    summary: "Read the authenticated user"
    group: "me"
    surfaces:
      cli:
        pattern: ["me"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/user"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
  project.list:
    summary: "List projects you belong to"
    group: "project"
    surfaces:
      cli:
        pattern: ["project", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          membership: true
          simple: true
          archived: false
          order_by: "path"
          sort: "asc"
          search:
            when: "search"
            value: "{search}"
    input:
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
      search:
        type: "string"
        description: "Search project names"
        minLength: 1
  project.get:
    summary: "Read one project"
    group: "project"
    surfaces:
      cli:
        pattern: ["project", "get"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
    required: ["project"]
  user.list:
    summary: "Find users by username"
    group: "user"
    surfaces:
      cli:
        pattern: ["user", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/users"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          username:
            when: "username"
            value: "{username}"
    input:
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
      username:
        type: "string"
        description: "Exact username"
        minLength: 1
  label.list:
    summary: "List project labels"
    group: "label"
    surfaces:
      cli:
        pattern: ["label", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}/labels"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          include_ancestor_groups: true
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    required: ["project"]
  milestone.list:
    summary: "List project milestones"
    group: "milestone"
    surfaces:
      cli:
        pattern: ["milestone", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}/milestones"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          include_ancestors: true
          state: "active"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    required: ["project"]
  issue.list:
    summary: "Search project issues"
    group: "issue"
    surfaces:
      cli:
        pattern: ["issue", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}/issues"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          state: "{state}"
          search:
            when: "search"
            value: "{search}"
          in: "title"
          labels:
            when: "labels"
            value: "{labels}"
          assignee_username:
            when: "assignee_username"
            value: "{assignee_username}"
          order_by: "updated_at"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
      state:
        type: "string"
        enum: ["opened", "closed", "all"]
        default: "opened"
      search:
        type: "string"
        description: "Search issue titles"
        minLength: 1
      labels:
        type: "string"
        description: "Comma-separated required labels"
        minLength: 1
      assignee_username:
        type: "string"
        description: "Assignee username"
        minLength: 1
    required: ["project"]
  issue.get:
    summary: "Read an issue"
    group: "issue"
    surfaces:
      cli:
        pattern: ["issue", "get"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}/issues/{iid}"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      iid:
        type: "integer"
        description: "Project-local issue number (iid), not the global issue ID"
        minimum: 1
    required: ["project", "iid"]
  issue.create:
    summary: "Create an issue"
    group: "issue"
    surfaces:
      cli:
        pattern: ["issue", "create"]
      mcp: true
    run:
      rest:
        method: "POST"
        endpoint: "{$config.api}/projects/{project}/issues"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        body:
          title: "{title}"
          issue_type: "{issue_type}"
          description:
            when: "description"
            value: "{description}"
          labels:
            when: "labels"
            value: "{labels}"
          milestone_id:
            when: "milestone_id"
            value: "{milestone_id}"
          assignee_ids:
            when: "assignee_ids"
            value: "{assignee_ids}"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      title:
        type: "string"
        description: "Issue title"
        minLength: 1
      description:
        type: "string"
        description: "Markdown description"
      labels:
        type: "string"
        description: "Comma-separated labels replacing the current list"
      milestone_id:
        type: "integer"
        description: "Milestone ID"
        minimum: 1
      assignee_ids:
        type: "array"
        items:
          type: "integer"
          minimum: 0
        description: "Assignee IDs; use 0 to unassign"
      issue_type:
        type: "string"
        enum: ["issue", "incident", "task"]
        default: "issue"
    required: ["project", "title"]
  issue.update:
    summary: "Update issue fields"
    group: "issue"
    surfaces:
      cli:
        pattern: ["issue", "update"]
      mcp: true
    run:
      rest:
        method: "PUT"
        endpoint: "{$config.api}/projects/{project}/issues/{iid}"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        body:
          title:
            when: "title"
            value: "{title}"
          description:
            when: "description"
            value: "{description}"
          labels:
            when: "labels"
            value: "{labels}"
          milestone_id:
            when: "milestone_id"
            value: "{milestone_id}"
          assignee_ids:
            when: "assignee_ids"
            value: "{assignee_ids}"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      iid:
        type: "integer"
        description: "Project-local issue number (iid), not the global issue ID"
        minimum: 1
      title:
        type: "string"
        description: "Issue title"
        minLength: 1
      description:
        type: "string"
        description: "Markdown description"
      labels:
        type: "string"
        description: "Comma-separated labels replacing the current list"
      milestone_id:
        type: "integer"
        description: "Milestone ID"
        minimum: 1
      assignee_ids:
        type: "array"
        items:
          type: "integer"
          minimum: 0
        description: "Assignee IDs; use 0 to unassign"
    required: ["project", "iid"]
  issue.state:
    summary: "Record a reason and close or reopen an issue"
    group: "issue"
    surfaces:
      cli:
        pattern: ["issue", "state"]
      mcp: true
    run: [{"rest": {"method": "POST", "endpoint": "{$config.api}/projects/{project}/issues/{iid}/notes", "headers": {"PRIVATE-TOKEN": "{$env.GITLAB_TOKEN}"}, "body": {"body": "{note}"}}}, {"rest": {"method": "PUT", "endpoint": "{$config.api}/projects/{project}/issues/{iid}", "headers": {"PRIVATE-TOKEN": "{$env.GITLAB_TOKEN}", "Accept": "application/json"}, "body": {"state_event": "{state_event}"}}}]
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      iid:
        type: "integer"
        description: "Project-local issue number (iid), not the global issue ID"
        minimum: 1
      state_event:
        type: "string"
        enum: ["close", "reopen"]
      note:
        type: "string"
        description: "Reason for changing the state"
        minLength: 1
    required: ["project", "iid", "state_event", "note"]
  note.list:
    summary: "List issue notes, including system events"
    group: "note"
    surfaces:
      cli:
        pattern: ["note", "list"]
      mcp: true
    run:
      rest:
        method: "GET"
        endpoint: "{$config.api}/projects/{project}/issues/{iid}/notes"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        query:
          page: "{page}"
          per_page: "{per_page}"
          sort: "asc"
          order_by: "created_at"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      iid:
        type: "integer"
        description: "Project-local issue number (iid), not the global issue ID"
        minimum: 1
      page:
        type: "integer"
        minimum: 1
        default: 1
      per_page:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    required: ["project", "iid"]
  note.create:
    summary: "Add a note to an issue"
    group: "note"
    surfaces:
      cli:
        pattern: ["note", "create"]
      mcp: true
    run:
      rest:
        method: "POST"
        endpoint: "{$config.api}/projects/{project}/issues/{iid}/notes"
        headers:
          PRIVATE-TOKEN: "{$env.GITLAB_TOKEN}"
          Accept: "application/json"
        body:
          body: "{body}"
    input:
      project:
        type: "integer"
        description: "Numeric GitLab project ID; find it with project list"
        minimum: 1
      iid:
        type: "integer"
        description: "Project-local issue number (iid), not the global issue ID"
        minimum: 1
      body:
        type: "string"
        description: "Markdown note"
        minLength: 1
    required: ["project", "iid", "body"]
